name: CI

# Checks only. Deployment is Cloudflare's job now: Workers Builds watches the
# repository and runs the build itself, so nothing here ships anything.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Kept even though nothing here consumes the output: it is what catches a
      # build break on a pull request, before the branch is merged and Workers
      # Builds runs the same build against production.
      - name: Build the static UI
        run: npm run build
