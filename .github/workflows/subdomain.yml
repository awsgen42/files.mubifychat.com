name: workers.dev subdomain

# Reports the account's workers.dev subdomain, and registers one when a name
# is supplied. Run with no input first to see the current state.
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Subdomain to register (leave blank to only report the current state)'
        required: false
        default: ''

jobs:
  subdomain:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WANTED: ${{ inputs.subdomain }}
    steps:
      - name: Inspect and optionally register
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"

          echo "== Token verification =="
          curl -sS "$API/user/tokens/verify" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq '{success, errors, status: .result.status}'

          echo "== Current workers.dev subdomain =="
          CURRENT=$(curl -sS "$API/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          echo "$CURRENT" | jq '{success, errors, subdomain: .result.subdomain}'

          if [ -z "${WANTED:-}" ]; then
            echo "No subdomain name supplied — reporting only."
            exit 0
          fi

          echo "== Registering '$WANTED' =="
          RESULT=$(curl -sS -X PUT "$API/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$WANTED\"}")
          echo "$RESULT" | jq '.'

          # A name someone else already holds comes back as success:false, so
          # the job must fail rather than let the deploy be retried blindly.
          if [ "$(echo "$RESULT" | jq -r '.success')" != "true" ]; then
            echo "Registration failed — see errors above (the name may be taken)."
            exit 1
          fi
          echo "Registered. Workers will publish to <script>.$WANTED.workers.dev"
