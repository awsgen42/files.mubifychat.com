name: Provision Cloudflare resources

# One-off setup: creates the KV namespace and R2 buckets the Worker binds to,
# then prints their ids so they can be pasted into wrangler.jsonc. Safe to
# re-run — existing resources are reused rather than duplicated.
on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create KV namespace and R2 buckets
        run: |
          set -euo pipefail

          WORKER=$(grep -oP '"name"\s*:\s*"\K[^"]+' wrangler.jsonc | head -1)
          echo "Worker name: $WORKER"

          # Wrangler has used both "<worker>-<binding>" and a bare "<binding>"
          # as the namespace title depending on version, so accept either.
          kv_id_for() {
            npx wrangler kv namespace list 2>/dev/null \
              | jq -r --arg a "${WORKER}-$1" --arg b "$1" \
                  '.[] | select(.title==$a or .title==$b) | .id' | head -1
          }

          KV_ID=$(kv_id_for SESSIONS || true)
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create SESSIONS
            KV_ID=$(kv_id_for SESSIONS)
          else
            echo "Reusing the existing SESSIONS namespace"
          fi

          KV_PREVIEW_ID=$(kv_id_for SESSIONS_preview || true)
          if [ -z "$KV_PREVIEW_ID" ]; then
            npx wrangler kv namespace create SESSIONS --preview
            KV_PREVIEW_ID=$(kv_id_for SESSIONS_preview)
          else
            echo "Reusing the existing SESSIONS_preview namespace"
          fi

          if [ -z "$KV_ID" ] || [ -z "$KV_PREVIEW_ID" ]; then
            echo "Could not resolve namespace ids. Namespaces currently on the account:"
            npx wrangler kv namespace list
            exit 1
          fi

          # `create` on an existing bucket is an error, which is fine to ignore.
          npx wrangler r2 bucket create "$WORKER" || echo "Bucket $WORKER already exists, continuing"
          npx wrangler r2 bucket create "${WORKER}-preview" || echo "Bucket ${WORKER}-preview already exists, continuing"

          echo "RESULT kv_id=$KV_ID"
          echo "RESULT kv_preview_id=$KV_PREVIEW_ID"

          {
            echo "### Cloudflare resources ready"
            echo ""
            echo "| Binding | Value |"
            echo "|---|---|"
            echo "| SESSIONS id | \`$KV_ID\` |"
            echo "| SESSIONS preview_id | \`$KV_PREVIEW_ID\` |"
            echo "| R2 bucket | \`$WORKER\` |"
            echo "| R2 preview bucket | \`${WORKER}-preview\` |"
          } >> "$GITHUB_STEP_SUMMARY"
